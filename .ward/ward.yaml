# Per-repo command allowlist for steam-ops / steam-mcp (the `ward` gate).
#
# Deploy verbs are deliberately absent - the deploy surface lives in
# coilyco-bridge/deploy per the layer invariant (source -> deploy).

commands:
  sync:
    run: uv sync --group dev
    description: uv lock + uv sync with dev deps.
  test:
    run: uv run pytest
    description: Run the pytest suite.
  lint:
    run: bash scripts/ward-quality.sh check
    description: ruff check + ruff format --check + mypy on src/ and tests/.
  fmt:
    run: bash scripts/ward-quality.sh format
    description: Apply ruff fixes and formatting in place.
  precommit:
    run: uv run pre-commit run --all-files
    description: Run all pre-commit hooks against every file.
  build-docker:
    run: docker build -t steam-mcp:local .
    description: Build the steam-mcp docker image locally.
  run:
    run: uv run steam-mcp
    description: Run the MCP server locally over streamable-HTTP on :9112.

catalog:
  kind: Component
  type: service
  system: infrastructure
  owner: kai
  lifecycle: production
  description: "Read-only MCP exposing Kai's Steam library (owned games, recently played) over streamable-HTTP, backed by the Steam Web API. The second pure-read clone of the personal-MCP fleet and its second credential shape (a Web API key); key + steamid64 resolve from env/SSM at runtime and never enter the image. Repo is steam-ops, image/service is steam-mcp. Deploy surface lives in coilyco-bridge/deploy."
  dependsOn: []
  providesApis:
    - steam-mcp
