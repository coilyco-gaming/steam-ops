# Tests, then builds and publishes the steam-mcp image to the in-cluster
# registry on every push to main. No deploy stage here: rollout is driven from
# coilyco-bridge/deploy per the layer invariant (source -> deploy). Mirrors
# coilyco-flight-deck/reddit-mcp's build-publish. The repo is steam-ops, but the
# image/service is steam-mcp.
#
# Per-step notes for the publish job (the code-comments YAML rule keeps rationale
# up here in the header rather than inline beside the steps):
# - Run both jobs in the pinned aos dev-base image. It already ships uv/Python
#   and the Docker CLI, so CI no longer needs ad hoc bootstrap installs.
# - Resolve docker host: the DinD sidecar shares the runner pod's netns on :2375,
#   but the job container sits on a separate per-workflow bridge - so probe
#   candidate hosts and pin the first that answers. Same shape as reddit-mcp.
# - Build and push: to the in-cluster registry. The DinD sidecar carries
#   --insecure-registry=192.168.0.194:30500, so the plain-http push round-trips.
#   Legacy builder (no buildx plugin in the static CLI).
name: build-publish

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - run: ward exec test
      - run: ward exec lint

  publish:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE=192.168.0.194:30500/steam-mcp:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
